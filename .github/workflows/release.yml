name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc = runs on more Linux distributions
            asset: WEB-Treasure-Stalker-linux-x64
          - os: windows-latest
            asset: WEB-Treasure-Stalker-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libgl1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "yt-dlp[default]" pyside6-essentials pyinstaller

      - name: Pure-Python charset_normalizer (its compiled modules are unsigned)
        shell: bash
        run: |
          # Windows Smart App Control blocked charset_normalizer's unsigned cd/md .pyd files. The project also
          # publishes a pure-Python wheel with the same code; bundle that one instead.
          pip download --no-deps --only-binary=:all: --platform any --python-version 3.12 \
            -d purewheel "charset-normalizer==$(python -c 'import charset_normalizer as c; print(c.__version__)')"
          pip install --force-reinstall --no-deps purewheel/charset_normalizer-*-py3-none-any.whl
          python -c "import charset_normalizer.md as m, sys; f = m.__file__; print(f); sys.exit(f.endswith('.py') is False)"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build single-file executable
        run: pyinstaller packaging/wts.spec --noconfirm --distpath dist --workpath build

      - name: Rename & smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/WEB-Treasure-Stalker "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" --check-tools
          QT_QPA_PLATFORM=offscreen timeout 20 "dist/${{ matrix.asset }}" || [ $? -eq 124 ]

      - name: Rename & smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/WEB-Treasure-Stalker.exe "dist/${{ matrix.asset }}"
          $p = Start-Process -FilePath "dist/${{ matrix.asset }}" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: exit $($p.ExitCode)" }

      # Code signing (Windows) through SignPath. Runs only when the repository variables
      # SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG and the secret SIGNPATH_API_TOKEN
      # are set (see packaging/SIGNING.md); otherwise the executable is released unsigned as before.
      - name: Upload unsigned executable for signing
        id: upload-unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Sign executable (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # each release is approved by hand on SignPath
          output-artifact-directory: dist-signed

      - name: Use the signed executable
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item "dist-signed/${{ matrix.asset }}" "dist/${{ matrix.asset }}" -Force
          $sig = Get-AuthenticodeSignature "dist/${{ matrix.asset }}"
          if ($sig.Status -ne 'Valid') { throw "signature not valid: $($sig.Status)" }
          $sig.SignerCertificate.Subject

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: WEB-Treasure-Stalker-*   # not the unsigned-* copies sent for signing
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: assets/*
          body: |
            ## WEB-Treasure-Stalker ${{ github.ref_name }}

            Single-file desktop app for Linux and Windows. Download it and run it; no install needed.

            | Platform | File |
            |---|---|
            | Windows 10/11 (x64) | `WEB-Treasure-Stalker-windows-x64.exe` |
            | Linux (x64, glibc ≥ 2.35) | `WEB-Treasure-Stalker-linux-x64` (run `chmod +x` first) |

            **First run:** open **Tools** and click *Install* for FFmpeg (needed for best-quality merges and
            format conversion) and the Chromium engine (needed for full web-site analysis). Downloads are
            checksum-verified. Tools already on your system are detected automatically.

            Run without arguments to open the GUI. Run with arguments to use the CLI
            (e.g. `WEB-Treasure-Stalker <url> -y -p <folder> -f mp4`, or `--help`).

            If the Windows executable is not code-signed yet, SmartScreen may warn: choose *More info → Run anyway*.
            Verify the file against `SHA256SUMS.txt`.
