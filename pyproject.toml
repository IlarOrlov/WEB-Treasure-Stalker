[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-treasure-stalker"
version = "0.3.0"
description = "Discover and download all videos on a web site, scan site and media for malware/attacks, and flag likely piracy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.1.1",
    "playwright>=1.45",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyside6-essentials>=6.6",
]

[project.optional-dependencies]
yara = ["yara-python>=4.5"]
dev = ["pytest>=8"]

[project.scripts]
wts = "wts.__main__:entry"

[tool.setuptools.packages.find]
include = ["wts*"]

[tool.setuptools.package-data]
wts = ["rules/*.yar", "gui/assets/*", "gui/assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright Chromium", "network: needs internet access"]
