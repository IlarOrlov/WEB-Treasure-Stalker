<!doctype html><html><head><meta charset="utf-8"><title>Show season 1</title>
<style>.d-none{display:none}iframe{width:640px;height:360px}span,li{display:inline-block;padding:8px;cursor:pointer}</style></head><body>
<h1>Show</h1>
<!-- watch-list buttons (not players): must never be clicked as player tabs -->
<ul class="mylists-tabs"><li class="tabz watching">Смотрю</li><li class="tabz scheduled">Запланировано</li>
<li class="tabz postponed">Брошено</li><li class="tabz thrown">Отложено</li></ul>
<div class="tabs-block">
<!-- only the selected tab carries a class; the trailer tab sits next to the players -->
<div class="tabs-block__select tabs-block__select--player"><span class="is-active">Смотреть онлайн</span><span>Kodik</span><span>Трейлер</span></div>
<div class="tabs-block__content player-slot"><iframe src="player_enc.html"></iframe></div>
<div class="tabs-block__content player-slot d-none"></div>
<div class="tabs-block__content player-slot d-none">trailer</div>
</div>
<script>
const spans = document.querySelectorAll('.tabs-block__select span'), slots = document.querySelectorAll('.player-slot');
spans.forEach((t, i) => t.addEventListener('click', () => {
  spans.forEach(s => s.classList.remove('is-active')); t.classList.add('is-active');
  slots.forEach(s => s.classList.add('d-none')); slots[i].classList.remove('d-none');
  if (i === 1 && !slots[1].querySelector('iframe')) slots[1].innerHTML = '<iframe src="player_good.html"></iframe>';
}));
document.querySelectorAll('.tabz').forEach(t => t.addEventListener('click', () => document.title = 'WATCHLIST CLICKED'));
</script></body></html>
