<!doctype html><html><head><meta charset="utf-8"><title>Show - season 1 episode 1</title>
<style>.tabs__content{display:none}.tabs__content--active{display:block}iframe{width:640px;height:360px}
.tabs__item{display:inline-block;padding:8px;cursor:pointer}</style></head><body>
<h1>Show season 1 episode 1</h1>
<div class="tabs"><div class="tabs__items">
  <div class="tabs__item tabs__item--active" data-slug="alpha">Player 1</div>
  <div class="tabs__item" data-slug="beta">Player 2</div>
  <div class="tabs__item" data-slug="gamma">Player 3</div>
</div>
<div class="tabs__content tabs__content--active" data-slug="alpha"><div class="player"><iframe src="player_enc.html"></iframe></div></div>
<div class="tabs__content" data-slug="beta"><div class="player">Видео недоступно</div></div>
<div class="tabs__content" data-slug="gamma"><div class="player"></div></div>
</div>
<script>
document.querySelectorAll('.tabs__item').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tabs__item,.tabs__content').forEach(e => e.classList.remove('tabs__item--active','tabs__content--active'));
  t.classList.add('tabs__item--active');
  const c = document.querySelector('.tabs__content[data-slug="' + t.dataset.slug + '"]');
  c.classList.add('tabs__content--active');
  if (t.dataset.slug === 'gamma' && !c.querySelector('iframe')) c.querySelector('.player').innerHTML = '<iframe src="player_good.html"></iframe>';
}));
</script></body></html>
