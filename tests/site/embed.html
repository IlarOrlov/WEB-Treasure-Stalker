<!doctype html>
<html>
<head><meta charset="utf-8"><title>player</title></head>
<body>
  <div id="box"></div>
  <script>
    // jwplayer-style config; the real element is created dynamically
    var config = {"file": "\/media\/clip2.mp4", "autostart": true};
    var v = document.createElement("video");
    v.src = config.file; v.muted = true; v.preload = "auto";
    document.getElementById("box").appendChild(v);
  </script>
</body>
</html>
